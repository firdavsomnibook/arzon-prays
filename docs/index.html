<style>
/* Layout: sticky header with search, tabbed work area; product cards hold an offers grid that stacks on phones. */
:root {
  --bg: #f4f6f4;
  --surface: #ffffff;
  --surface-2: #eef2ef;
  --line: #d9e1dc;
  --fg: #16231d;
  --muted: #5a6b62;
  --accent: #0b6b55;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe8;
  --ok: #157a3c;
  --ok-bg: #e2f4e8;
  --near: #8a5a00;
  --near-bg: #fbf0d6;
  --bad: #b3261e;
  --bad-bg: #fbe4e1;
  --check: #6b5a00;
  --check-bg: #f6f0c9;
  --none: #5f6b66;
  --none-bg: #e9edeb;
  --promo: #7a3db8;
  --promo-bg: #f1e7fb;
  --shadow: 0 1px 2px rgba(22, 35, 29, .06), 0 4px 14px rgba(22, 35, 29, .05);
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1613; --surface: #16201b; --surface-2: #1c2822; --line: #2a3832; --fg: #e5ede8; --muted: #95a69d;
    --accent: #3fbf98; --accent-ink: #062018; --accent-soft: #173a30;
    --ok: #5fd28a; --ok-bg: #173523; --near: #f0bf5a; --near-bg: #3a2e12; --bad: #ff8a80; --bad-bg: #3d1a17;
    --check: #e6d36a; --check-bg: #36320f; --none: #a3b0aa; --none-bg: #222c28; --promo: #c79bf2; --promo-bg: #2c1f3d;
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1613; --surface: #16201b; --surface-2: #1c2822; --line: #2a3832; --fg: #e5ede8; --muted: #95a69d;
  --accent: #3fbf98; --accent-ink: #062018; --accent-soft: #173a30;
  --ok: #5fd28a; --ok-bg: #173523; --near: #f0bf5a; --near-bg: #3a2e12; --bad: #ff8a80; --bad-bg: #3d1a17;
  --check: #e6d36a; --check-bg: #36320f; --none: #a3b0aa; --none-bg: #222c28; --promo: #c79bf2; --promo-bg: #2c1f3d;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.num { font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 0; }
.top-inner, .main { max-width: 1080px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { font-family: var(--f-display); font-size: 20px; margin: 0; letter-spacing: .01em; color: var(--accent); }
.brand .sub { color: var(--muted); font-size: 13px; }
.search { margin-top: 10px; position: relative; }
.search input { width: 100%; padding: 12px 40px 12px 14px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface-2); font-size: 17px; }
.search input:focus { border-color: var(--accent); background: var(--surface); outline: none; }
.search .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--muted); font-size: 20px; width: 32px; height: 32px; border-radius: 8px; }
.tabs { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: transparent; padding: 10px 12px; border-bottom: 2.5px solid transparent; color: var(--muted); font-weight: 500; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs .count { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 10px; font-size: 12px; background: var(--surface-2); }
.tabs .count.bad { background: var(--bad-bg); color: var(--bad); }

.main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 48px; display: grid; gap: 14px; }
.notice { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; color: var(--muted); font-size: 14px; }
.notice.warn { border-color: var(--near); color: var(--fg); background: var(--near-bg); }
.loading { color: var(--muted); padding: 24px 0; text-align: center; }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; text-align: left; }
.tile b { font-size: 24px; font-weight: 700; }
.tile span { color: var(--muted); font-size: 13px; }
.tile.bad b { color: var(--bad); }
.tile.promo b { color: var(--promo); }
button.tile:hover { border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
.chip:hover { border-color: var(--accent); }
.hint { color: var(--muted); font-size: 13px; }
h2.sec { font-size: 15px; margin: 6px 0 0; font-weight: 600; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.card-h { padding: 12px 14px 10px; display: grid; gap: 4px; }
.card-h .t { font-weight: 600; font-size: 16px; }
.card-h .m { color: var(--muted); font-size: 13px; }
.limits { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; padding: 8px 14px; background: var(--surface-2); border-top: 1px solid var(--line); }
.limits span { color: var(--muted); }
.limits b { font-weight: 600; }
.offers { display: grid; }
.offer { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, .8fr) minmax(0, 1.2fr); gap: 4px 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.offer.head { padding-block: 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; background: var(--surface); }
.offer .sup { font-weight: 600; min-width: 0; }
.offer .sup small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.offer .price b { font-size: 16px; }
.offer .price small, .offer .sale small { display: block; color: var(--muted); font-size: 12px; }
.offer .lbl { display: none; color: var(--muted); font-size: 12px; }
.offer.best { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }
.tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 6px; margin-left: 6px; vertical-align: 2px; }
.tag.best { background: var(--accent); color: var(--accent-ink); }
.tag.short { background: var(--near-bg); color: var(--near); }
.pill { display: inline-flex; flex-direction: column; gap: 1px; padding: 5px 9px; border-radius: 8px; font-size: 13px; font-weight: 600; line-height: 1.25; }
.pill small { font-weight: 400; font-size: 12px; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.near { background: var(--near-bg); color: var(--near); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.check { background: var(--check-bg); color: var(--check); }
.pill.none { background: var(--none-bg); color: var(--none); }
.promo-box { grid-column: 1 / -1; display: flex; gap: 10px; align-items: flex-start; background: var(--promo-bg); color: var(--fg); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.promo-box .pt { color: var(--promo); font-weight: 700; white-space: nowrap; font-size: 12px; letter-spacing: .05em; padding-top: 2px; }
.promo-box .pb { min-width: 0; }
.promo-box .pb small { display: block; color: var(--muted); font-size: 12px; }
.check-note { grid-column: 1 / -1; font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 6px 10px; }
.more { padding: 12px; text-align: center; color: var(--muted); }

.list { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 4px 12px; padding: 10px 14px; border-top: 1px solid var(--line); align-items: center; text-align: left; border-left: 0; border-right: 0; border-bottom: 0; background: transparent; width: 100%; }
.row:first-child { border-top: 0; }
button.row:hover { background: var(--surface-2); }
.row .n { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.row .n small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.row .v { font-size: 14px; }
.row .v small { display: block; color: var(--muted); font-size: 12px; }
.bad-t { color: var(--bad); font-weight: 600; }
.promo-t { color: var(--promo); font-weight: 600; }

.suppliers { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.sup-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; align-content: start; }
.sup-card h3 { margin: 0; font-size: 16px; }
.sup-card dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; font-size: 13px; }
.sup-card dt { color: var(--muted); }
.sup-card dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 9px; padding: 8px 12px; font-weight: 500; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.sup-card.add { border-style: dashed; place-content: center; text-align: center; min-height: 140px; background: transparent; }
.setting { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.setting input { width: 80px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

.modal-bg { position: fixed; inset: 0; background: rgba(10, 20, 15, .45); z-index: 20; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--surface); border-radius: 14px; width: min(720px, 100%); max-height: 100%; overflow: auto; padding: 18px; display: grid; gap: 12px; }
.modal h3 { margin: 0; font-size: 18px; }
.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.field input, .field select { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--fg); font-size: 15px; min-width: 0; }
.mapgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.preview { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.preview table { border-collapse: collapse; font-size: 13px; width: 100%; }
.preview th, .preview td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.preview th { color: var(--muted); font-weight: 500; }
.progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.grid-gap { display: grid; gap: 12px; }
.err { color: var(--bad); font-size: 14px; }
.okmsg { color: var(--ok); font-size: 14px; }

@media (max-width: 760px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .offer.head { display: none; }
  .offer { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .offer .sup { grid-column: 1 / -1; }
  .offer .lbl { display: block; }
  .offer .st { grid-column: 1 / -1; }
  .row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .row .n { grid-column: 1 / -1; }
  .mapgrid { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.chip.stale { border-color: var(--near); }
.age { color: var(--muted); font-weight: 400; }
.sup-card h3 .tag { vertical-align: 3px; }
.sup-card.add:disabled, .btn:disabled { opacity: .5; cursor: default; }
.flash { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow); width: max-content; max-width: calc(100% - 32px); font-size: 14px; }
.main { max-width: 1112px; }
.tabs .ico { vertical-align: -6px; margin-right: 5px; color: var(--accent); }
.tabs .ico circle { fill: var(--accent); }
.tiles { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.tile.expt b { color: var(--bad); }
.card-h.drug { background: var(--accent-soft); border-bottom: 1px solid var(--line); }
.card-h.drug .dl, .oname span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.card-h.drug .t { font-size: 18px; font-weight: 700; color: var(--fg); line-height: 1.3; }
.oname { margin-top: 4px; font-weight: 600; font-size: 14px; color: var(--fg); overflow-wrap: anywhere; }
.oname small { display: inline; font-weight: 400; color: var(--muted); }
.tabs .count.new { background: var(--ok); color: var(--surface); font-weight: 700; }
.card.watch .card-h { background: var(--surface-2); border-bottom: 1px solid var(--line); }
.wadd { display: flex; gap: 8px; padding: 12px 14px; }
.wadd input { flex: 1; min-width: 0; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 9px; background: var(--surface); font-size: 16px; }
.wadd input:focus { border-color: var(--accent); outline: none; }
.watch .notice.ok-n { margin: 0 14px 12px; background: var(--ok-bg); border-color: var(--ok); color: var(--fg); }
.crow.wrow { grid-template-columns: minmax(0, 1fr) auto; }
.wrow .btns { flex-wrap: nowrap; }
.wrow.fresh { background: var(--ok-bg); }
.ok-t { color: var(--ok); }
.vswitch { display: flex; gap: 6px; }
.vswitch .btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.tbl { border-collapse: collapse; font-size: 14px; table-layout: fixed; min-width: 100%; }
.tbl th { position: relative; }
.tbl td { overflow: hidden; overflow-wrap: anywhere; }
.rz { position: absolute; top: 0; right: -4px; width: 9px; height: 100%; cursor: col-resize; z-index: 2; touch-action: none; }
.rz::after { content: ""; position: absolute; left: 3px; top: 0; height: 100%; width: 2px; background: var(--fg); }
.tbl th, .tbl td { border-right: 1px solid color-mix(in srgb, var(--fg) 45%, transparent); }
.tbl th:last-child, .tbl td:last-child { border-right: 0; }
.tbl thead th { border-bottom: 2px solid var(--fg); }
.tbl th button { color: var(--fg) !important; font-weight: 800 !important; font-size: 14px !important; text-transform: none; }
.rz:hover::after, .rz.on::after { background: var(--accent); width: 3px; left: 3px; }
body.resizing, body.resizing * { cursor: col-resize !important; user-select: none !important; }
.tbl th { position: sticky; top: 0; background: var(--surface-2); text-align: left; border-bottom: 1px solid var(--line); padding: 0; white-space: nowrap; }
.tbl th button { border: 0; background: transparent; padding: 9px 10px; font-weight: 600; font-size: 13px; color: var(--muted); width: 100%; text-align: inherit; }
.tbl th.num { text-align: right; }
.tbl td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl td.num { text-align: right; }
.tbl tbody tr:nth-child(even) { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
.tbl tbody tr:hover { background: var(--accent-soft); }
.tbl tr.st-bad td.tp { color: var(--bad); }
.tbl tr.st-near td.tp { color: var(--near); }

.tbl .tm, .tbl .ts { color: var(--fg); font-size: 13px; font-weight: 500; }
.tbl td.td { color: var(--fg); font-weight: 500; }
.tbl .lnk { border: 0; background: none; padding: 0; text-align: left; font-weight: 600; color: var(--fg); cursor: pointer; }
.tbl .lnk:hover { color: var(--accent); text-decoration: underline; }
.tbl .tc .btn { padding: 4px 8px; white-space: nowrap; }
.tag.promo { background: var(--promo-bg); color: var(--promo); }
.more-btn { justify-self: center; }

.tbl tbody tr:focus { outline: 2px solid var(--near); outline-offset: -2px; }
.drugm { width: min(620px, 100%); gap: 10px; }
.dm-l { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.dm-t { font-size: 22px !important; text-align: center; padding-bottom: 10px; border-bottom: 2px solid var(--fg); }
.dm { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 0; margin: 0; }
.dm dt { color: var(--muted); padding: 9px 12px 9px 0; border-bottom: 1px solid var(--line); }

.dm dd input { width: 100%; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface-2); font-size: 15px; }

.dm-sale { text-align: right; color: var(--bad); font-size: 20px; font-weight: 700; }
.dm-sale b { font-size: 30px; font-weight: 800; margin-left: 6px; }
.lossbox { border: 2px solid var(--bad); background: var(--bad-bg); color: var(--fg); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.lossbox.warnbox { border-color: var(--near); background: var(--near-bg); }
.lb-t { font-size: 19px; font-weight: 800; color: var(--bad); } .warnbox .lb-t { color: var(--near); }
.lb-row { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; } .lb-row span { color: var(--muted); }

// Arzon Prays — yadro: Excel o'qish, aksiyalar, referent bilan moslashtirish
(function (root) {
  'use strict';

  // ---------- umumiy yordamchilar ----------
  const LAT2CYR = { a: 'а', b: 'в', c: 'с', e: 'е', h: 'н', k: 'к', m: 'м', o: 'о', p: 'р', t: 'т', x: 'х', y: 'у' };
  function norm(s) {
    return String(s == null ? '' : s)
      .toLowerCase()
      .replace(/ё/g, 'е')
      .replace(/[®™©"«»“”'`’]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }
  // lotin harflari kirillga o'xshash bo'lsa (masalan "METTO" ~ "МЕТТО") bitta ko'rinishga keltiramiz
  function fold(s) {
    return norm(s).replace(/[a-z]/g, (c) => LAT2CYR[c] || c);
  }
  function toNum(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    const s = String(v).replace(/\s| /g, '').replace(',', '.');
    const n = parseFloat(s);
    return isFinite(n) ? n : null;
  }
  function excelDate(v) {
    if (v == null || v === '') return null;
    if (v instanceof Date) return v;
    if (typeof v === 'number' && v > 20000 && v < 80000) {
      return new Date(Math.round((v - 25569) * 86400000));
    }
    const s = String(v).trim();
    let m = s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{2,4})/);
    if (m) {
      let y = +m[3]; if (y < 100) y += 2000;
      return new Date(Date.UTC(y, +m[2] - 1, +m[1]));
    }
    m = s.match(/^(\d{1,2})[./](\d{4})$/);
    if (m) return new Date(Date.UTC(+m[2], +m[1] - 1, 1));
    m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    m = s.toLowerCase().match(/^([а-я]+)\.?\s*(\d{4})/);
    if (m) { const mo = monthIdx(m[1]); if (mo != null) return new Date(Date.UTC(+m[2], mo, 1)); }
    return null;
  }
  function isoDate(d) {

const TR = [['sh', 'ш'], ['ch', 'ч'], ['ya', 'я'], ['yu', 'ю'], ['yo', 'е'], ['ts', 'ц'], ['zh', 'ж'], ['kh', 'х'], ["o'", 'о'], ["g'", 'г'], ['oʻ', 'о'], ['gʻ', 'г'], ['o‘', 'о'], ['g‘', 'г']];
const TR1 = { a: 'а', b: 'б', v: 'в', g: 'г', d: 'д', e: 'е', z: 'з', i: 'и', y: 'й', k: 'к', l: 'л', m: 'м', n: 'н', o: 'о', p: 'п', r: 'р', s: 'с', t: 'т', u: 'у', f: 'ф', h: 'х', x: 'х', j: 'ж', q: 'к', w: 'в', c: 'ц' };
function translit(s) {

}
const TOKRE = new Map();
function tokHit(hay, t) {
  if (t.length >= 4 && !/^\d/.test(t)) return hay.includes(t);

    const e = t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    // raqam: oldida raqam bo'lmasin, ortida ham (3 != 30); harf: so'z boshi yoki raqamdan keyin (3мл)
    re = /^\d/.test(t) ? new RegExp('(^|[^0-9])' + e + (/\d$/.test(t) ? '(?![0-9])|(^|[^0-9])' + e + '000' : '')) : new RegExp('(^|[^a-zа-я])' + e);
    TOKRE.set(t, re);
  }

}
function hayNorm(s) { return C.fold(s).replace(/ы/g, 'и').replace(/э/g, 'е').replace(/[^a-zа-я0-9%.,/+ ]/g, ' ').replace(/\s+/g, ' ').trim(); }
// so'rovning ikki ko'rinishi: lotinni kirillga o'girilgani ("sitamet" -> "ситамет") va
// lotin nomlar o'zicha ("x-cite", "bless") — qaysi biri mos kelsa, o'sha olinadi
function queryVariants(q) {

  if (/[a-z]/i.test(q)) add(translit(q));

}

function unpackPromos(list) {
  return (list || []).map((p) => ({ buy: p[0], free: p[1], freeName: p[2], sameItem: !!p[3], from: p[4], to: p[5], onlyExp: p[6] }));
}
function rebuildOffers() {
  for (const s of S.sups.values()) { if (s.origName == null) s.origName = s.name; const dn = (S.supInfo[s.id] || {}).display; s.name = dn && dn.trim() ? dn.trim() : s.origName; }
  const offers = [];
  for (const sup of S.sups.values()) {
    if (sup.deleted || !sup.items || HIDDEN.has(sup.id)) continue;
    for (const it of sup.items) {
      const [name, price, maker, exp, ri, mok, alts, promos] = it;
      const r = ri >= 0 ? S.ref[ri] : null;
      const o = { sup, name, price, maker, exp, ri: r ? ri : -1, mok: !!mok, alts: alts || [], promos: unpackPromos(promos) };
      o.promo = o.promos.find((p) => C.promoActive(p, TODAY)) || null;
      o.eff = o.promo ? C.effPrice(price, o.promo) : price;
      o.hay = hayNorm(name + ' ' + (r ? r.brand + ' ' + r.mnn : ''));
      o.hay2 = o.hay.replace(/ /g, '');
      o.key = r ? 'r' + ri : 'n' + itemKey(name);
      offers.push(o);
    }
  }
  S.offers = offers; brandIdx = null;
  S.offerByKey = new Map();
  S.offersByItem = new Map();
  offers.forEach((o, i) => {
    o.idx = i; S.offerByKey.set(o.sup.id + '|' + o.name, o);
    o.ik = itemKey(o.name);
    if (!S.offersByItem.has(o.ik)) S.offersByItem.set(o.ik, []);
    S.offersByItem.get(o.ik).push(o);
  });
  S.groups = new Map();
  for (const o of offers) {
    if (!S.groups.has(o.key)) S.groups.set(o.key, []);
    S.groups.get(o.key).push(o);
  }

}
function applyStatus() {
  const k = 1 + S.markup / 100;
  for (const o of S.offers) o.st = statusOf(o, k);
  $('#cWarn').textContent = S.offers.filter((o) => o.st.cls === 'bad').length;
  $('#cPromo').textContent = S.offers.filter((o) => o.promo).length;
}
function statusOf(o, k) {
  const sale = o.price * k;
  if (o.ri < 0) return { cls: 'none', label: "Referentda yo'q", note: "Erkin narx yoki ro'yxatda topilmadi", sale };
  const r = S.ref[o.ri];
  const maxBuy = Math.min(r.opt, r.ret / k);
  if (!o.mok) {
    const alts = (o.alts.length ? o.alts : [o.ri]).map((i) => S.ref[i]).filter(Boolean);
    return { cls: 'check', label: 'Tekshiring', note: 'Referentda boshqa ishlab chiqaruvchi', sale, maxBuy, alts };
  }
  if (o.price > maxBuy + 0.5) {
    const over = o.price - maxBuy;
    const why = o.price > r.opt + 0.5 ? 'optovik narxi ulgurji chegaradan yuqori' : 'sotuv narxi chakana chegaradan oshadi';
    return { cls: 'bad', label: 'Olmang', note: '+' + fmt(over) + " so'm (" + (over / maxBuy * 100).toFixed(1) + '%) — ' + why, sale, maxBuy, over };
  }
  if (o.price > maxBuy * 0.97) return { cls: 'near', label: 'Chegaraga yaqin', note: fmt(maxBuy - o.price) + " so'm qoldi", sale, maxBuy };
  return { cls: 'ok', label: "Olsa bo'ladi", note: 'Chegaradan ' + fmt(maxBuy - o.price) + " so'm past", sale, maxBuy };
}

function errText(err) {

// ---------- hisoblash (sahifani qotirmasdan) ----------
function ensureIdx() { if (!S.idx) S.idx = C.buildReferentIndex(S.ref); return S.idx; }
function packAsync(res, meta, onP) {
  return new Promise((resolve) => {
    const idx = ensureIdx();
    const items = []; let k = 0; const n = res.items.length;
    function step() {
      const end = Math.min(n, k + 400);
      for (; k < end; k++) {
        const it = res.items[k]; const m = C.matchItem(it, idx);
        const promos = (it.promos || []).map((p) => [p.buy, p.free, p.freeName, p.sameItem ? 1 : 0, p.from, p.to, p.onlyExp]);
        items.push([it.name, it.price, it.maker, it.exp, m ? m.i : -1, m && m.makerOk ? 1 : 0, m && !m.makerOk ? m.alts.slice(0, 12) : [], promos]);
      }
      if (onP) onP(k / Math.max(1, n));
      if (k < n) setTimeout(step, 0); else resolve(Object.assign({}, meta, { items }));
    }
    step();
  });
}
// referent o'zgargan bo'lsa, prayslarni yangi ro'yxat bilan qayta solishtiramiz; yozilmay qolganlar sonini qaytaradi
async function rematchAll(onP, persist) {
  const sups = [...S.sups.values()].filter((s) => !s.deleted && s.refVer !== S.refMeta.ver);
  let done = 0, failed = 0;
  for (const s of sups) {
    const res = { items: s.items.map((x) => ({ name: x[0], price: x[1], maker: x[2], exp: x[3], promos: unpackPromos(x[7]) })) };
    const packed = await packAsync(res, Object.assign({}, s, { refVer: S.refMeta.ver, items: undefined }), (p) => onP && onP((done + p) / sups.length));
    S.sups.set(s.id, packed);
    if (persist && !S.noPersist.has(s.id)) { try { await persistSupplier(packed); } catch (e) { failed++; } }
    done++;
  }
  rebuildOffers();
  return failed;
}
function setReferent(meta, rows) { S.refMeta = meta; S.ref = C.refFromRows(rows); S.idx = null; }

// ---------- saqlash (bulut: db + assets) ----------
function withTimeout(p, ms) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout', message: 'timeout' }), ms))]);
}
async function retry(fn) {
  try { return await withTimeout(fn(), 15000); } catch (e) {
    if (e && (e.code === 'unavailable' || e.code === 'store_unavailable')) { await sleep(400 + Math.random() * 600); return withTimeout(fn(), 15000); }
    throw e;
  }
}
async function uploadJSON(obj) {
  const blob = new Blob([JSON.stringify(obj)], { type: 'application/json' });
  const r = await retry(() => S.assets.upload(blob, { type: 'application/json' }));
  return r.id;
}
async function persistSupplier(packed) {
  if (!S.db || !S.assets) return;
  const ref = S.db.doc('suppliers/' + packed.id);
  const old = await retry(() => ref.get());
  const assetId = await uploadJSON(packed);
  await retry(() => ref.set({ id: packed.id, name: packed.name, fileName: packed.fileName, uploadedAt: packed.uploadedAt,
    refVer: packed.refVer, map: packed.map || {}, count: packed.items.length, promoCount: packed.promoCount || 0, assetId, deleted: false }));
  const prev = old.exists ? (old.data() || {}).assetId : null;
  if (prev && prev !== assetId) { try { await S.assets.delete(prev); } catch (e) { /* eski fayl qolib ketsa ham zarari yo'q */ } }
}
async function persistReferent(meta, rows) {
  if (!S.db || !S.assets) return;
  const ref = S.db.doc('referent/current');
  const old = await retry(() => ref.get());
  const assetId = await uploadJSON({ ver: meta.ver, fileName: meta.fileName, uploadedAt: meta.uploadedAt, rows });
  await retry(() => ref.set(Object.assign({}, meta, { assetId, count: rows.length })));
  const prev = old.exists ? (old.data() || {}).assetId : null;
  if (prev && prev !== assetId) { try { await S.assets.delete(prev); } catch (e) { /* ignore */ } }
}
async function fetchJSON(url) {
  if (url.startsWith('/_blob/') && window.FB) return withTimeout(window.FB.blobJSON(url.slice(7)), 60000);
  const r = await withTimeout(fetch(url), 30000);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

const tgState = { list: {}, status: null, chats: null, busy: false, failed: {}, err: {}, checkedAt: null };
function tgSeen(id) { const t = tgState.list[id]; const s = S.sups.get(id); return Math.max(t ? t.msgId || 0 : 0, s && s.tgMsg ? s.tgMsg : 0); }
function tgWhen(iso) {

}
function tgLocalDate(iso) { const d = new Date(iso); if (isNaN(d)) return TODAY; return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
async function tgReadRows(sid) {

  tgState.busy = true; let changed = false;

    const qs = await retry(() => S.db.collection('tgprice').get());

    tgState.list = list; tgState.checkedAt = new Date().toISOString(); changed = true;

        if (res.guessed) throw new Error("ustun nomlari tanilmadi — bir marta tekshirib saqlang");
        C.attachPromos(res.items, res.promos);

async function boot() {
  try {
    const [ref, ...sups] = await Promise.all([fetchJSON('data/referent.json'), ...SEEDS.map((id) => fetchJSON('data/' + id + '.json'))]);
    setReferent({ ver: ref.ver, fileName: ref.fileName, uploadedAt: ref.uploadedAt }, ref.rows);
    sups.forEach((s) => S.sups.set(s.id, s));
  } catch (e) {
    $('#main').innerHTML = `<div class="notice warn">Boshlang'ich ma'lumotlarni yuklab bo'lmadi (${esc(e.message || e.code || e)}). Sahifani yangilang.</div>`;
    return;
  }
  S.company = Object.assign({}, COMPANY_DEF); loadLocalCompany();
  if (!window.claude || !window.claude.use) loadLocalSupInfo();
  const hasClaude = !!(window.claude && typeof window.claude.use === 'function');
  S.mode = hasClaude ? 'loading' : 'local';
  if (!hasClaude) { S.ready = true; loadLocalCart(); loadLocalOrders(); loadLocalWatch(); }
  rebuildOffers(); render();
  if (!hasClaude) { announceWatch(); return; }

  const use = (n) => withTimeout(window.claude.use(n), 12000).catch(() => null);
  const [db, assets] = await Promise.all([use('db'), use('assets')]);
  S.db = db; S.assets = db ? assets : null;
  if (!db) { S.mode = 'offline'; S.ready = true; loadLocalSupInfo(); loadLocalCart(); loadLocalOrders(); loadLocalWatch(); render(); announceWatch(); return; }
  S.mode = assets ? 'edit' : 'view';
  if (S.mode === 'view') { loadLocalCart(); loadLocalOrders(); loadLocalWatch(); }
  else {
    if (S.mode === 'view') loadLocalSupInfo(); else { try { const qs2 = await retry(() => db.collection('supinfo').get()); qs2.docs.forEach((d) => { S.supInfo[d.id] = d.data() || {}; }); } catch (e) { /* ignore */ } }
    try { const cd = await retry(() => db.doc('settings/company').get()); if (cd.exists) S.company = Object.assign({}, COMPANY_DEF, cd.data()); } catch (e) { /* standart qiymatlar qoladi */ }
    try { const wd = await retry(() => db.doc('watch/list').get()); if (wd.exists && Array.isArray((wd.data() || {}).items)) S.watch = wd.data().items.map((x) => ({ ...x, seen: [...(x.seen || [])] })); }
    catch (e) { S.notes.push("Izlanayotgan dorilar ro'yxatini o'qib bo'lmadi."); }
    try {
      const os = await retry(() => db.collection('orders').get());
      S.orders = os.docs.map((d) => d.data()).filter((o) => o && Array.isArray(o.items));
    } catch (e) { S.notes.push("Buyurtmalar tarixini bulutdan o'qib bo'lmadi."); }
    try {
      const cs = await retry(() => db.collection('cart').get());
      for (const d of cs.docs) { const it = (d.data() || {}).items; if (Array.isArray(it) && it.length) S.cart[d.id] = it.map((x) => ({ n: x.n, p: x.p, q: x.q })); }
    } catch (e) { S.notes.push("Savatni bulutdan o'qib bo'lmadi."); }
  }
  render();

  let refFailed = false;
  try {
    const [st, rc, qs] = await Promise.all([
      retry(() => db.doc('settings/main').get()),
      retry(() => db.doc('referent/current').get()),
      retry(() => db.collection('suppliers').get()),
    ]);
    if (st.exists && typeof (st.data() || {}).markup === 'number') S.markup = st.data().markup;
    if (rc.exists && (rc.data() || {}).assetId) {
      const d = rc.data();
      try {
        const ref = await fetchJSON('/_blob/' + d.assetId);
        setReferent({ ver: d.ver, fileName: d.fileName, uploadedAt: d.uploadedAt }, ref.rows);
      } catch (e) {
        refFailed = true;
        S.notes.push(`Yangilangan referent ro'yxati (${fmtDate(d.uploadedAt)}) ochilmadi — vaqtincha ${fmtDate(S.refMeta.uploadedAt)} kungi ro'yxat bilan solishtirilmoqda.`);
      }
    }
    const missing = [];
    await Promise.all(qs.docs.map(async (doc) => {
      const d = doc.data() || {};
      if (!d.id) return;
      if (d.deleted) { const s = S.sups.get(d.id); if (s) s.deleted = true; return; }
      if (!d.assetId) return;
      try {
        const s = await fetchJSON('/_blob/' + d.assetId);
        s.map = d.map || s.map;
        S.sups.set(d.id, s);
      } catch (e) { missing.push(d); S.noPersist.add(d.id); }
    }));
    if (missing.length) {
      const fallback = missing.some((d) => S.sups.has(d.id));
      S.notes.push(`${missing.map((d) => d.name || d.id).join(', ')}: bulutdagi yangi prays ochilmadi.` + (fallback ? " Sahifa bilan kelgan eski nusxa ko'rsatilmoqda, sanasiga qarang." : '') + ' Sahifani keyinroq yangilang.');
    }
    await rematchAll(null, S.mode === 'edit' && !refFailed);
  } catch (e) {
    S.notes.push("Bulutdagi ma'lumotlarni o'qib bo'lmadi (" + errText(e) + ") Sahifa bilan kelgan prayslar ko'rsatilmoqda.");
  }
  S.ready = true;
  rebuildOffers(); render();
  announceWatch();
}

let audioCtx = null;
let soundOn = true;
try { soundOn = localStorage.getItem('ap_sound') !== '0'; } catch (e) { /* ignore */ }
// varoq ovozi: qisqa "shsh" — filtrlangan shovqin
function flip() {
  if (!soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    // haqiqiy varoq: qog'oz shitirlashi (mayda "chirt"lar) + oxirida yengil "pat" urilish
    // mayin kitob varag'i: yumshoq "fsh-sh" — sekin ko'tarilib, silliq so'nadi
    const sr = audioCtx.sampleRate, dur = 0.5, len = Math.floor(sr * dur);
    const buf = audioCtx.createBuffer(1, len, sr), d = buf.getChannelData(0);
    let prev = 0, crack = 0;
    for (let i = 0; i < len; i++) {
      const x = i / len;
      const env = Math.pow(Math.sin(Math.PI * Math.pow(x, 0.75)), 2.2);
      if (Math.random() < 0.0006) crack = 0.5; crack *= 0.996;
      const n = (Math.random() * 2 - 1);
      prev = prev * 0.55 + n * 0.45; // yumshatilgan shovqin
      d[i] = prev * env * (0.5 + crack * 0.5);
    }
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const t = audioCtx.currentTime;
    const hp = audioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 300;
    const pk = audioCtx.createBiquadFilter(); pk.type = 'bandpass'; pk.Q.value = 0.6;
    pk.frequency.setValueAtTime(1200, t); pk.frequency.linearRampToValueAtTime(2600, t + dur * 0.55); pk.frequency.linearRampToValueAtTime(1400, t + dur);
    const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 4200;
    const g = audioCtx.createGain(); g.gain.value = 0.9;
    src.connect(hp); hp.connect(pk); pk.connect(lp); lp.connect(g); g.connect(audioCtx.destination); src.start(t);
  } catch (e) { /* ovoz chiqmasa ham ishlayveradi */ }
}
function beep(kind) {
  if (!soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const notes = kind === 'done' ? [523, 659, 784, 1047] : kind === 'add' ? [660, 990] : kind === 'up' ? [880] : [440];
    notes.forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      const step = kind === 'done' ? 0.11 : 0.07, len = kind === 'done' && i === notes.length - 1 ? 0.35 : 0.09;
      const s = t + i * step;
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.25, s + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, s + len);
      o.connect(g); g.connect(audioCtx.destination); o.start(s); o.stop(s + len + 0.01);
    });
  } catch (e) { /* ovoz chiqmasa ham ishlayveradi */ }
}

<script>// ---------- versiya: saytda yangi versiya chiqsa, ogohlantirish ----------
(function () {
  const cur = window.APP_VERSION || 0;
  let shown = false;
  async function check() {
    if (shown) return;
    try {
      const r = await fetch(location.pathname + '?vc=' + Date.now(), { cache: 'no-store' });
      const m = (await r.text()).match(/APP_VERSION\s*=\s*(\d+)/);
      const v = m ? +m[1] : 0;
      if (v > cur) {
        shown = true;
        const b = document.createElement('div'); b.id = 'verBar';
        b.innerHTML = `🔄 Yangi versiya chiqdi: <b>v${v}</b> (sizda v${cur}) <button type="button">Yangilash</button>`;
        b.querySelector('button').onclick = () => location.replace(location.pathname + '?v=' + v);
        document.body.appendChild(b);
      }
    } catch (e) { /* internet yo'q — keyinroq */ }
  }
  setTimeout(check, 4000); setInterval(check, 10 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
})();
</script>
