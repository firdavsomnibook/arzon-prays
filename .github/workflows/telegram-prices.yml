name: Telegram prayslar

on:
  schedule:
    # bot ~5.5 soat uzluksiz ishlaydi (navbat har 10 soniyada); tugasa — navbatdagi darhol boshlanadi
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: telegram-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r worker/requirements.txt
      - name: Kanallarni tekshirish
        run: python worker/fetch_prices.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          FB_BOT_EMAIL: ${{ secrets.FB_BOT_EMAIL }}
          FB_BOT_PASSWORD: ${{ secrets.FB_BOT_PASSWORD }}
      - name: Keyingi botni darhol ishga tushirish (bo'shliq bo'lmasin)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run telegram-prices.yml --ref ${{ github.ref_name }} || true
      - name: Faollik belgisi (GitHub 60 kun jim turgan jadvalni o'chirib qo'ymasligi uchun)
        if: always()
        run: |
          if [ -z "$(git log -1 --since='30 days ago' --format=%H)" ]; then
            date -u > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive && git commit -m "keepalive" && git push
          fi
